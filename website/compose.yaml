services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      TRUST_PROXY: "true"
    volumes:
      - enquiries:/app/data
      - backups:/app/backups
    expose:
      - "3001"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  enquiries:
  backups:
  caddy_data:
  caddy_config:
